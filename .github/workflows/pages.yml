name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build and validate public site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_site.py --refresh-releases
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
