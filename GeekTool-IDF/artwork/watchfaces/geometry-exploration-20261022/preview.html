<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>几何读时 · 六款圆屏概念</title>
  <style>:root{color-scheme:dark;--page:#171a19;--ink:#edece4;--muted:#acb2ac;--rule:#3b423d;--accent:#bdd4c6}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1518px;margin:auto;padding:32px 34px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--muted);margin:0 0 12px}h1{font-size:28px;line-height:1.35;font-weight:500;letter-spacing:2px;margin:0 0 8px}.intro{font-size:13px;line-height:1.6;color:var(--muted);margin:0}.current{display:grid;gap:5px;text-align:right}.current output{font-size:40px;font-weight:300;letter-spacing:3px;font-variant-numeric:tabular-nums}.current span{font-size:12px;color:var(--muted)}
button,input{font:inherit}button{background:none;border:1px solid var(--rule);border-radius:3px;color:var(--muted);padding:9px 14px;font-size:13px;cursor:pointer}button[aria-pressed=true]{background:#e3e7dd;color:#1b211d;border-color:#e3e7dd}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.controls{display:flex;align-items:center;justify-content:space-between;gap:22px;padding:18px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}.presets{display:flex;gap:6px;flex-wrap:wrap}.scrub{display:grid;grid-template-columns:auto minmax(65px,140px) auto minmax(65px,140px);align-items:center;gap:12px;min-width:0}.scrub label{font-size:12px;white-space:nowrap;color:var(--muted)}.scrub output{color:var(--ink);display:inline-block;min-width:18px;font-variant-numeric:tabular-nums}input[type=range]{width:100%;min-width:0;accent-color:var(--accent)}.assist{font-size:13px;white-space:nowrap;display:flex;gap:8px;align-items:center;color:var(--muted)}input[type=checkbox]{accent-color:var(--accent)}.directions-nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 8px}.directions-nav button{border-color:transparent}.directions-nav button[aria-pressed=true]{background:#2d352f;color:var(--ink)}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px;padding-top:24px}.direction{min-width:0}.direction-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding-bottom:20px;border-bottom:1px solid var(--rule);margin-bottom:24px}.direction-head h2{font-size:15px;font-weight:500;letter-spacing:2px;margin:0}.direction-head span{font-size:12px;letter-spacing:2px;color:var(--muted)}.faces{display:grid;gap:34px}figure{margin:0;min-width:0}.screen{aspect-ratio:1;width:100%;max-width:466px;border-radius:50%;outline:1px solid #303833;margin:auto;overflow:hidden;background:#000}.screen svg{display:block;width:100%;height:auto}figcaption{padding-top:18px}.caption-line{display:flex;align-items:baseline;gap:10px}.index{color:#8e9c90;font-size:12px;letter-spacing:2px}h3{font-size:17px;font-weight:500;letter-spacing:2px;margin:0}h3 small{font-size:12px;letter-spacing:2px;font-weight:400;color:var(--muted);margin-left:9px}.rule{color:var(--muted);font-size:13px;line-height:1.75;margin:9px 0 0;max-width:34em}footer{border-top:1px solid var(--rule);padding-top:20px;margin-top:36px;color:var(--muted);font-size:12px;line-height:1.7}.board[data-focus]:not([data-focus=all]){grid-template-columns:minmax(0,1fr)}.board[data-focus]:not([data-focus=all]) .faces{grid-template-columns:repeat(2,minmax(0,1fr));gap:44px}.direction[hidden]{display:none}
@media(max-width:1080px){.controls{flex-wrap:wrap}.scrub{flex:1}.board{gap:22px}main{padding:28px 24px}.direction-head{display:block}.direction-head span{display:block;margin-top:8px}}
@media(max-width:760px){main{padding:24px 18px}.board{grid-template-columns:minmax(0,1fr);gap:40px}.direction-head{display:flex;align-items:baseline}.direction-head span{margin-top:0}.faces{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.controls{gap:18px}.scrub{order:3;flex-basis:100%}.assist{margin-left:auto}h3 small{display:block;margin:5px 0 0}h1{font-size:23px}.current output{font-size:32px}.rule{font-size:12px}.board[data-focus]:not([data-focus=all]) .faces{gap:20px}}
@media(max-width:470px){.faces,.board[data-focus]:not([data-focus=all]) .faces{grid-template-columns:minmax(0,1fr);gap:30px}.current{display:none}.eyebrow{font-size:11px;letter-spacing:2px}.presets button{padding:9px 11px}.controls{gap:16px}.assist{margin-left:0}.scrub{gap:8px}.directions-nav{gap:4px}.directions-nav button{padding:8px 9px}h3 small{display:inline-block;margin:0 0 0 9px}figcaption{padding-top:14px}.rule{font-size:13px}}
</style>

</head>
<body data-direction="all">
  <!-- 独立概念稿：所有示例为本地时分输入。 / Independent concepts: all samples use local time inputs. -->
  <main>
    <header><div><p class="eyebrow">GEOMETRIC TIME / EXPLORATION 03</p><h1>让时间，成为形状。</h1><p class="intro">六款466px圆屏概念 · 图形直接对应时分</p></div><div class="current"><output id="sample-time" aria-live="polite">10:08</output><span>样例时间</span></div></header>
    <section class="controls" aria-label="预览控制">
      <div class="presets" role="group" aria-label="样例时间"><button type="button" data-time="10:08" aria-pressed="true">10:08</button><button type="button" data-time="00:00" aria-pressed="false">00:00</button><button type="button" data-time="06:30" aria-pressed="false">06:30</button><button type="button" data-time="23:59" aria-pressed="false">23:59</button></div>
      <div class="scrub"><label for="hour">时 <output id="hour-value">10</output></label><input id="hour" type="range" min="0" max="23" value="10"><label for="minute">分 <output id="minute-value">08</output></label><input id="minute" type="range" min="0" max="59" value="8"></div>
      <label class="assist"><input id="assist" type="checkbox">辅助数字</label>
    </section>
    <nav class="directions-nav" aria-label="设计方向"><button type="button" data-direction="all" aria-pressed="true">全部六款</button><button type="button" data-direction="position" aria-pressed="false">A / 位置</button><button type="button" data-direction="area" aria-pressed="false">B / 面积</button><button type="button" data-direction="rotation" aria-pressed="false">C / 旋转</button></nav>
    <div id="board" class="board" data-focus="all"></div>
    <footer>概念效果预览 · 时间可调 · 还未接入固件、官网或设备</footer>
  </main>
<script>/* 几何概念稿的唯一绘制来源；不接设备。 / Single rendering source for geometry concepts; no device access. */
(() => {
  'use strict';
  const designs = [
    {key:'cross', number:'01', name:'坐标', en:'CROSS', group:'position', rule:'横坐标是24小时，纵坐标是分钟。'},
    {key:'balance', number:'02', name:'支点', en:'BALANCE', group:'position', rule:'长端朝向读小时，游标沿杆的位置读分钟。'},
    {key:'hourglass', number:'03', name:'沙漏', en:'HOURGLASS', group:'area', rule:'上方面积是12小时，下方面积是分钟。'},
    {key:'quanta', number:'04', name:'方量', en:'QUANTA', group:'area', rule:'大方块面积是24小时，小方块面积是分钟。'},
    {key:'phase', number:'05', name:'合相', en:'PHASE', group:'rotation', rule:'大半圆弧顶指小时，小半圆弧顶指分钟。'},
    {key:'aperture', number:'06', name:'开合', en:'APERTURE', group:'rotation', rule:'缝隙宽度是24小时，双片顺时针旋转读分钟。'}
  ];
  const palette = {paper:'#e9e6db', mint:'#9ab8ac', gold:'#d5a36c', dim:'#373e3c'};
  const n = value => Number(value.toFixed(4));
  const points = list => list.map(([x,y])=>`${n(x)},${n(y)}`).join(' ');
  const polygon = (list,fill,extra='') => `<polygon points="${points(list)}" fill="${fill}" ${extra}/>`;
  const line = (x1,y1,x2,y2,stroke,width=2,extra='') => `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${stroke}" stroke-width="${width}" ${extra}/>`;
  const circle = (x,y,r,fill,extra='') => `<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${fill}" ${extra}/>`;
  function time(hour,minute) {
    if(!Number.isInteger(hour)||!Number.isInteger(minute)||hour<0||hour>23||minute<0||minute>59) throw new RangeError('Time must be HH:MM within one day');
    return {hour,minute,day:(hour+minute/60)/24,h12:(hour%12+minute/60)/12,m:minute/60,stamp:`${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`};
  }
  function corners(cx,cy,side) {
    const loX=cx-side/2,loY=cy-side/2,hiX=cx+side/2,hiY=cy+side/2;
    return [[loX,loY,1,1],[hiX,loY,-1,1],[hiX,hiY,-1,-1],[loX,hiY,1,-1]].map(([x,y,dx,dy])=>line(x,y,x+dx*11,y,palette.dim,1.5)+line(x,y,x,y+dy*11,palette.dim,1.5)).join('');
  }
  function cross(t) {
    const x=104+t.day*258,y=364-t.m*258;
    return corners(233,235,258)+line(x,106,x,364,palette.paper,13)+line(104,y,362,y,palette.mint,3)+circle(x,y,9,palette.mint,'stroke="#000" stroke-width="4"');
  }
  function balance(t) {
    const angle=t.h12*Math.PI*2,u=[Math.sin(angle),-Math.cos(angle)];
    const at=distance=>[233+u[0]*distance,224+u[1]*distance];
    const start=at(-90),end=at(145),cursor=at(-90+235*t.m);
    return line(...start,...end,palette.paper,13,'stroke-linecap="round"')+circle(233,224,17,'#000',`stroke="${palette.dim}" stroke-width="2"`)+circle(...end,4,palette.paper)+circle(...cursor,13,palette.gold,'stroke="#000" stroke-width="4"');
  }
  function hourglass(t) {
    const outline='stroke="#3b4140" stroke-width="1.5" stroke-linejoin="round"';
    // 面积随时间线性变化：三角形填充高度必须用平方根反推。
    // Area, not height, is linear in time; invert triangular area with a square root.
    const depth=p=>132*(1-Math.sqrt(1-p));
    function fill(p,top) {
      if(p===0) return '';
      const d=depth(p),inset=121*d/132,y=top?94:372,next=top?y+d:y-d;
      return polygon([[112,y],[354,y],[354-inset,next],[112+inset,next]],top?palette.paper:palette.mint,`data-area="${top?'hour':'minute'}"`);
    }
    return polygon([[112,94],[354,94],[233,226]],'none',outline)+polygon([[233,240],[112,372],[354,372]],'none',outline)+fill(t.h12,true)+fill(t.m,false);
  }
  function quanta(t) {
    // 正方形边长按sqrt(progress)缩放，保持可见面积与时分成正比。
    // Scale square side by sqrt(progress), keeping visible area proportional to time.
    const square=(cx,cy,max,p,color,kind)=>{
      const side=max*Math.sqrt(p);
      return p===0?'':`<rect x="${n(cx-side/2)}" y="${n(cy-side/2)}" width="${n(side)}" height="${n(side)}" fill="${color}" data-area="${kind}"/>`;
    };
    return corners(161,177,164)+corners(312,310,128)+square(161,177,164,t.day,palette.paper,'hour')+square(312,310,128,t.m,palette.mint,'minute');
  }
  function phase(t) {
    const semi=(r,color,angle)=>`<g transform="rotate(${n(angle)} 233 224)"><path d="M ${233-r} 224 A ${r} ${r} 0 0 1 ${233+r} 224 Z" fill="${color}" stroke="#000" stroke-width="7"/></g>`;
    // 半圆弧顶有方向，不是月相；两形共用十二点为角度起点。
    // Each semicircle has a directed bulge, not a lunar phase; both start at twelve o'clock.
    return circle(233,51,2,'#626d66')+semi(143,palette.paper,t.h12*360)+semi(96,palette.mint,t.m*360);
  }
  function aperture(t) {
    const gap=6+102*t.day,half=gap/2;
    // 两片异色区分180度方向，避免只显示30分钟周期。
    // Different slab colors disambiguate 180 degrees, preserving the full sixty-minute cycle.
    return `<g transform="rotate(${n(t.m*360)} 233 224)">`+polygon([[125,116],[233-half,116],[233-half,332],[125,332]],palette.paper)+polygon([[233+half,116],[341,116],[341,332],[233+half,332]],'#7f998d')+'</g>';
  }
  const drawers={cross,balance,hourglass,quanta,phase,aperture};
  function svg(key,hour=10,minute=8,assist=false) {
    const design=designs.find(item=>item.key===key);if(!design)throw new RangeError('Unknown geometry design');
    const t=time(hour,minute),hint=assist?`<text x="233" y="410" text-anchor="middle" fill="#b3b7b0" font-family="Arial,sans-serif" font-size="19" letter-spacing="4">${t.stamp}</text>`:'';
    return `<svg xmlns="http://www.w3.org/2000/svg" width="466" height="466" viewBox="0 0 466 466" role="img" aria-label="${design.name} ${t.stamp}；${design.rule}"><title>${design.name} ${t.stamp}</title><defs><clipPath id="screen-${key}"><circle cx="233" cy="233" r="233"/></clipPath></defs><g clip-path="url(#screen-${key})"><circle cx="233" cy="233" r="233" fill="#000"/>${drawers[key](t)}${hint}</g></svg>`;
  }
  globalThis.GeometryFaces={designs,time,svg};
})();
</script><script>/* 只重画当前输入，没有后台计时器。 / Render only on input; no background timers. */
(() => {
  'use strict';
  const {designs,svg,time}=GeometryFaces;
  const board=document.querySelector('#board'),hour=document.querySelector('#hour'),minute=document.querySelector('#minute'),assist=document.querySelector('#assist');
  const groups=[['position','A / 位置','POSITION'],['area','B / 面积','AREA'],['rotation','C / 旋转','ROTATION']];
  board.innerHTML=groups.map(([key,name,en])=>`<section class="direction" data-group="${key}" aria-label="${name}"><div class="direction-head"><h2>${name}读时</h2><span>${en}</span></div><div class="faces">${designs.filter(d=>d.group===key).map(d=>`<figure data-design="${d.key}"><div class="screen"></div><figcaption><div class="caption-line"><span class="index">${d.number}</span><h3>${d.name}<small>${d.en}</small></h3></div><p class="rule">${d.rule}</p></figcaption></figure>`).join('')}</div></section>`).join('');
  function render(){
    const t=time(Number(hour.value),Number(minute.value));
    document.querySelector('#sample-time').value=t.stamp;document.querySelector('#hour-value').value=String(t.hour).padStart(2,'0');document.querySelector('#minute-value').value=String(t.minute).padStart(2,'0');
    for(const d of designs)document.querySelector(`[data-design="${d.key}"] .screen`).innerHTML=svg(d.key,t.hour,t.minute,assist.checked);
    document.querySelectorAll('[data-time]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.time===t.stamp)));
  }
  for(const input of [hour,minute,assist])input.addEventListener('input',render);
  document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>{[hour.value,minute.value]=button.dataset.time.split(':').map(Number);render();}));
  function focus(direction){
    board.dataset.focus=direction;
    board.querySelectorAll('[data-group]').forEach(group=>group.hidden=direction!=='all'&&group.dataset.group!==direction);
    document.querySelectorAll('button[data-direction]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.direction===direction)));
  }
  document.querySelectorAll('button[data-direction]').forEach(button=>button.addEventListener('click',()=>focus(button.dataset.direction)));
  focus(document.body.dataset.direction);render();
})();
</script></body></html>
