<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>soRound · 极简字体探索</title><style> *{box-sizing:border-box}body{margin:0;background:#17191a;color:#eae9e3;font:16px system-ui,sans-serif}main{max-width:1518px;margin:auto;padding:30px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:32px}h1{font-size:22px;letter-spacing:2px;margin:0 0 8px}p{color:#9c9e99;font-size:13px;margin:0}nav{display:flex;gap:8px}button{font:inherit;background:#252829;color:#deded7;border:1px solid #454847;border-radius:24px;padding:10px 18px;cursor:pointer}button[aria-pressed=true]{background:#e6e1d5;color:#17191a}button:focus-visible{outline:2px solid #e7a26f;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 24px}figure{margin:0;text-align:center}img{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:50%;max-width:466px;margin:auto}figcaption{padding-top:14px;font-size:15px;letter-spacing:3px}small{color:#999d97;font-size:11px;letter-spacing:1px;margin-left:9px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start;flex-direction:column}main{padding:24px 16px}nav{flex-wrap:wrap}h1{font-size:20px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}</style><main><header><div><h1>TYPE EXPLORATIONS / 极简大字</h1><p>六款排版概念 · 466px 圆屏 · 尚未接入固件或官网</p></div><nav aria-label="样例时间"><button data-time="10:08" aria-pressed="true">10:08</button><button data-time="00:00" aria-pressed="false">00:00</button><button data-time="23:59" aria-pressed="false">23:59</button></nav></header><div class="grid"><figure><img data-key="stack" src="stack.svg" alt="STACK 10:08"><figcaption>STACK<small>叠字</small></figcaption></figure><figure><img data-key="air" src="air.svg" alt="AIR 10:08"><figcaption>AIR<small>细字</small></figcaption></figure><figure><img data-key="offset" src="offset.svg" alt="OFFSET 10:08"><figcaption>OFFSET<small>错位</small></figcaption></figure><figure><img data-key="column" src="column.svg" alt="COLUMN 10:08"><figcaption>COLUMN<small>分栏</small></figcaption></figure><figure><img data-key="cut" src="cut.svg" alt="CUT 10:08"><figcaption>CUT<small>切字</small></figcaption></figure><figure><img data-key="edition" src="edition.svg" alt="EDITION 10:08"><figcaption>EDITION<small>刊物</small></figcaption></figure></div></main><script>const designs=[{"key": "stack", "cn": "\u53e0\u5b57", "en": "STACK"}, {"key": "air", "cn": "\u7ec6\u5b57", "en": "AIR"}, {"key": "offset", "cn": "\u9519\u4f4d", "en": "OFFSET"}, {"key": "column", "cn": "\u5206\u680f", "en": "COLUMN"}, {"key": "cut", "cn": "\u5207\u5b57", "en": "CUT"}, {"key": "edition", "cn": "\u520a\u7269", "en": "EDITION"}];document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>{const time=button.dataset.time;document.querySelectorAll('[data-time]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));designs.forEach(design=>{const image=document.querySelector('[data-key="'+design.key+'"]');image.src='states/'+design.key+'-'+time.replace(':','')+'.svg';image.alt=design.en+' '+time;});}));</script></html>
