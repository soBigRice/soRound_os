<script>
(function () {
  'use strict';

  const C = 233;
  const TAU = Math.PI * 2;
  const pad = value => String(value).padStart(2, '0');
  const time = state => `${pad(state.h)}:${pad(state.m)}`;
  const point = (radius, angle, cx = C, cy = C) => [
    +(cx + Math.cos(angle) * radius).toFixed(2),
    +(cy + Math.sin(angle) * radius).toFixed(2),
  ];
  const line = (a, b, stroke, width = 1, extra = '') =>
    `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${stroke}" stroke-width="${width}" ${extra}/>`;
  const label = (x, y, value, size, fill, extra = '') =>
    `<text x="${x}" y="${y}" fill="${fill}" font-family="Barlow, sans-serif" font-size="${size}" text-anchor="middle" ${extra}>${value}</text>`;
  const dateLabel = state => {
    const date = state.date instanceof Date ? state.date : new Date();
    const weekday = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][date.getDay()];
    return `${weekday}   ${pad(date.getMonth() + 1)} / ${pad(date.getDate())}`;
  };

  function stillTime(state, y = 262) {
    return label(C, y, time(state), 72, '#4b4d4b', 'font-weight="500" letter-spacing="-2"');
  }

  function radar(state, aod) {
    if (aod) {
      return stillTime(state) + [0, 1, 2, 3].map(index => {
        const angle = index * Math.PI / 2;
        return line(point(180, angle), point(190, angle), '#202824');
      }).join('');
    }

    let grid = '';
    for (let offset = -160; offset <= 160; offset += 40) {
      // 网格止于内圆，不依赖卡片外部裁切。 / Trim the grid to the inner circle.
      const reach = Math.sqrt(196 * 196 - offset * offset);
      grid += line([C + offset, C - reach], [C + offset, C + reach], '#142b22');
      grid += line([C - reach, C + offset], [C + reach, C + offset], '#142b22');
    }
    const rings = [64, 128, 196].map(radius =>
      `<circle cx="233" cy="233" r="${radius}" fill="none" stroke="#1d3e2e" stroke-width="1"/>`
    ).join('');
    const ticks = Array.from({ length: 60 }, (_, index) => {
      const angle = index / 60 * TAU - Math.PI / 2;
      return line(point(index % 5 === 0 ? 187 : 193, angle), point(196, angle),
        index % 5 === 0 ? '#4f765b' : '#274531', index % 5 === 0 ? 1.5 : 1);
    }).join('');
    const angle = Number(state.s) / 60 * TAU - Math.PI / 2;
    const trail = Array.from({ length: 12 }, (_, index) => {
      const start = angle - (index + 1) * Math.PI / 90;
      const end = start + Math.PI / 90;
      const p1 = point(195, start);
      const p2 = point(195, end);
      return `<path d="M 233 233 L ${p1.join(' ')} A 195 195 0 0 1 ${p2.join(' ')} Z" fill="#89dc91" opacity="${(0.045 - index * 0.003).toFixed(3)}"/>`;
    }).join('');

    // 扫线只表达真实秒数，不生成虚构目标。 / The sweep represents seconds, never invented targets.
    return `<circle cx="233" cy="233" r="233" fill="#08130f"/>` +
      grid + rings + ticks + trail +
      line([233, 233], point(195, angle), '#9ce7a1', 1.4) +
      `<circle cx="233" cy="233" r="3" fill="#a5e7aa"/>` +
      label(C, 110, 'RADAR', 13, '#7baf88', 'letter-spacing="6" font-weight="500"') +
      `<rect x="73" y="181" width="320" height="102" rx="16" fill="#08130f" opacity="0.91"/>` +
      label(C, 261, time(state), 91, '#d3f3c9', 'font-weight="500" letter-spacing="-2.5"') +
      label(C, 327, dateLabel(state), 13, '#78977d', 'letter-spacing="2"') +
      label(C, 366, `${pad(state.s)} SEC`, 10, '#52735b', 'letter-spacing="3"');
  }

  function reel(cx, cy, rotation) {
    const radius = 65;
    const outline = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="#12120f" stroke="#7b776a" stroke-width="1.25"/>` +
      `<circle cx="${cx}" cy="${cy}" r="58" fill="none" stroke="#3f3d34" stroke-width="0.7"/>`;
    const spokes = [0, 1, 2].map(index => {
      const angle = index * 120;
      return `<g transform="rotate(${angle} ${cx} ${cy})">` +
        `<path d="M ${cx - 6} ${cy - 17} C ${cx - 11} ${cy - 29}, ${cx - 9} ${cy - 49}, ${cx} ${cy - 51} C ${cx + 14} ${cy - 51}, ${cx + 23} ${cy - 38}, ${cx + 14} ${cy - 24} L ${cx + 7} ${cy - 13}" fill="none" stroke="#c2bba5" stroke-width="1.5" stroke-linecap="round"/>` +
        `</g>`;
    }).join('');
    return outline + `<g transform="rotate(${rotation} ${cx} ${cy})">${spokes}` +
      `<circle cx="${cx}" cy="${cy}" r="16" fill="none" stroke="#c2bba5" stroke-width="1.25"/>` +
      `<path d="M ${cx - 5} ${cy} H ${cx + 5} M ${cx} ${cy - 5} V ${cy + 5}" stroke="#c2bba5" stroke-width="1.1"/>` +
      `</g>`;
  }

  function tape(state, aod) {
    if (aod) {
      return stillTime(state, 303) +
        `<circle cx="156" cy="165" r="16" fill="none" stroke="#252522"/>` +
        `<circle cx="310" cy="165" r="16" fill="none" stroke="#252522"/>`;
    }
    const rotation = (Number(state.s) + Number(state.m) * 60) * 6;
    // 卷盘逐秒旋转，字面时间独立保持可读。 / Reels follow seconds while the time stays fixed.
    return `<circle cx="233" cy="233" r="233" fill="#13130f"/>` +
      label(C, 67, dateLabel(state), 12, '#99957f', 'letter-spacing="2"') +
      `<path d="M 156 100 L 310 100 M 156 230 L 310 230" fill="none" stroke="#6d6755" stroke-width="1"/>` +
      reel(156, 165, rotation) + reel(310, 165, -rotation * 0.75) +
      `<path d="M 110 211 L 149 246 H 317 L 356 211" fill="none" stroke="#8e866d" stroke-width="1"/>` +
      `<path d="M 163 244 V 250 M 303 244 V 250" stroke="#c0b699" stroke-width="2"/>` +
      label(C, 326, time(state), 87, '#f1ead6', 'font-weight="500" letter-spacing="-2"') +
      `<path d="M 170 351 H 296" stroke="#39392e" stroke-width="1"/>` +
      label(C, 378, 'T A P E', 12, '#a49e88', 'font-weight="500" letter-spacing="3"') +
      label(C, 400, 'TIME IN MOTION', 8, '#646450', 'letter-spacing="2.6"');
  }

  function iris(state, aod) {
    if (aod) {
      return stillTime(state) +
        `<path d="M 126 191 L 159 140 H 307 L 340 191 M 340 275 L 307 326 H 159 L 126 275" fill="none" stroke="#292724" stroke-width="1"/>`;
    }
    const blades = Array.from({ length: 8 }, (_, index) => {
      // 叶片是同一几何的旋转副本，可映射为八个缓存矢量块。 / One blade geometry is reused eight times.
      const fill = index % 2 === 0 ? '#24211c' : '#1b1a17';
      return `<g transform="rotate(${index * 45} 233 233)">` +
        `<path d="M 233 35 C 296 35 350 65 382 108 L 340 191 L 307 140 L 159 140 Z" fill="${fill}" stroke="#353027" stroke-width="1"/>` +
        `<path d="M 382 108 L 340 191 L 307 140" fill="none" stroke="#766044" stroke-width="0.8"/>` +
        `</g>`;
    }).join('');
    const ticks = Array.from({ length: 60 }, (_, index) => {
      const angle = index / 60 * TAU - Math.PI / 2;
      return line(point(index % 5 === 0 ? 195 : 200, angle), point(204, angle),
        index % 5 === 0 ? '#92704c' : '#4f4232', 0.8);
    }).join('');
    const secondAngle = Number(state.s) / 60 * TAU - Math.PI / 2;
    const second = point(204, secondAngle);
    return `<circle cx="233" cy="233" r="233" fill="#13120f"/>` +
      blades +
      `<circle cx="233" cy="233" r="211" fill="none" stroke="#4c3b28" stroke-width="1"/>` +
      ticks +
      `<path d="M 159 140 H 307 L 340 191 V 275 L 307 326 H 159 L 126 275 V 191 Z" fill="#11110f" stroke="#af7a42" stroke-width="1.2"/>` +
      label(C, 189, 'IRIS', 11, '#b18b5d', 'font-weight="500" letter-spacing="5"') +
      label(C, 260, time(state), 72, '#eee5d5', 'font-weight="500" letter-spacing="-2"') +
      label(C, 296, dateLabel(state), 10, '#9c8d76', 'letter-spacing="1.5"') +
      `<circle cx="${second[0]}" cy="${second[1]}" r="2.8" fill="#e7a65b"/>` +
      label(C, 385, 'APERTURE OF TIME', 9, '#7c684e', 'letter-spacing="2.6"');
  }

  window.instrumentFaces = { radar, tape, iris };
}());

</script>
<script>
(() => {
  'use strict';
  const C=233,TAU=Math.PI*2,pad=n=>String(n).padStart(2,'0'),hm=s=>`${pad(s.h)}:${pad(s.m)}`;
  const pt=(r,angle,cx=C,cy=C)=>[cx+Math.sin(angle)*r,cy-Math.cos(angle)*r];
  const txt=(x,y,text,size=16,color='#eae8dd',weight=400,extra='')=>`<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="${weight}" fill="${color}" ${extra}>${text}</text>`;
  const line=(x1,y1,x2,y2,color,width=1,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}" ${extra}/>`;
  const circle=(x,y,r,color,extra='')=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" ${extra}/>`;
  const arc=(r,start,end,color,width=2)=>{const a=pt(r,start),b=pt(r,end);return `<path d="M${a} A${r},${r} 0 ${end-start>Math.PI?1:0} 1 ${b}" fill="none" stroke="${color}" stroke-width="${width}"/>`};
  const date=s=>`${pad(s.date.getMonth()+1)} / ${pad(s.date.getDate())} · TUE`;
  const ambientAod=(s,name)=>txt(C,174,name,13,'#4f554b',400,'letter-spacing="3"')+txt(C,265,hm(s),86,'#9a9d91',400)+line(183,294,283,294,'#373c33')+txt(C,323,'20 OCT',15,'#60685c');
  function maze(s,aod){
    if(aod)return ambientAod(s,'MAZE');
    let out=circle(C,C,233,'#e6e3d5');
    // 迷宫是装饰纹理，外圈小球才编码秒值。 / The maze is ornamental; the outer bead encodes seconds.
    [108,131,154,177].forEach((r,row)=>{for(let k=0;k<5;k++){const start=(k/5+row*.027)*TAU,end=start+TAU*.155;out+=arc(r,start,end,'#273229',3);if((k+row)%2===0){const a=pt(r,end),b=pt(r+23,end);out+=line(...a,...b,'#273229',3)}}});
    for(let i=0;i<60;i++){const a=pt(i%5?202:198,i*TAU/60),b=pt(207,i*TAU/60);out+=line(...a,...b,'#71776a',i%5?1:2)}
    out+=circle(C,C,88,'#e6e3d5')+txt(C,216,pad(s.h),94,'#26352d',600)+txt(C,299,pad(s.m),94,'#26352d',600)+line(195,235,271,235,'#c1c5b4',1.5);
    const bead=pt(189,s.s*TAU/60);out+=circle(...bead,8,'#d65c43')+circle(...bead,3,'#f5d6b3');
    return out+txt(C,76,'MAZE / 60',13,'#4d5a4b',600,'letter-spacing="3"')+txt(C,398,`${pad(s.s)} SECONDS`,12,'#4d5a4b',600,'letter-spacing="2"');
  }
  function flip(s,aod){
    if(aod)return ambientAod(s,'FOLD');
    let out=circle(C,C,233,'#293128')+circle(C,C,211,'none','stroke="#59624e" stroke-width="1"');
    out+=txt(C,66,'FOLD / TIME',14,'#b4bba4',600,'letter-spacing="4"');
    [92,239].forEach(y=>{out+=`<rect x="91" y="${y+4}" width="284" height="133" rx="14" fill="#111a12"/><rect x="96" y="${y}" width="274" height="133" rx="11" fill="#e7e3ce"/>`});
    out+=txt(C,211,pad(s.h),146,'#293128',600)+txt(C,358,pad(s.m),146,'#293128',600);
    [157,304].forEach(y=>{out+=line(97,y,369,y,'#566046',1.5)+line(97,y+2,369,y+2,'#fffae7',1);[94,362].forEach(x=>out+=`<rect x="${x}" y="${y-6}" width="10" height="13" rx="2" fill="#b6bda3" stroke="#4c5542" stroke-width="1"/>`)});
    return out+txt(C,408,'20 OCT   /   TUE',15,'#b4bba4',400,'letter-spacing="2"');
  }
  const digits={0:['01110','11011','11011','11011','11011','11011','01110'],1:['00110','01110','00110','00110','00110','00110','01111'],2:['01110','11011','00011','00110','01100','11000','11111'],3:['11110','00011','00011','01110','00011','00011','11110'],4:['00011','00111','01111','11011','11111','00011','00011'],5:['11111','11000','11000','11110','00011','00011','11110'],6:['01110','11000','11000','11110','11011','11011','01110'],7:['11111','00011','00110','00110','01100','01100','01100'],8:['01110','11011','11011','01110','11011','11011','01110'],9:['01110','11011','11011','01111','00011','00011','01110'],':':['00','00','11','00','11','00','00']};
  function pixelTime(s){let out='',x=107;for(const ch of hm(s)){digits[ch].forEach((row,y)=>{[...row].forEach((v,col)=>{if(v==='1')out+=`<rect x="${x+col*10}" y="${120+y*10}" width="8" height="8" fill="#d5e9ac"/>`})});x+=(ch===':'?3:6)*10}return out}
  function pixel(s,aod){
    if(aod)return ambientAod(s,'PIXEL CAMP');
    let out=circle(C,C,233,'#101b15')+txt(C,80,'20 OCT  /  TUE',15,'#9dae8b',400,'letter-spacing="3"')+pixelTime(s);
    [[103,228],[151,244],[338,227],[376,279],[240,228]].forEach(([x,y])=>out+=`<rect x="${x}" y="${y}" width="3" height="3" fill="#879f72"/>`);

    // 像素景物按秒换帧，不代表天气或养成数据。 / Pixel scenery changes each second; it is not weather or pet telemetry.
    out+=`<path d="M100 354 H366 M103 357 H168 M186 357 H266 M301 357 H361" stroke="#6c805c" stroke-width="3"/><path d="M177 350 L227 278 L281 350 Z" fill="#8eaa79"/><path d="M227 278 L245 350 L208 350 Z" fill="#314c36"/><path d="M227 278 L257 350" stroke="#b5c694" stroke-width="2"/>`;
    const cat=['10001','11111','11011','11111','01110','01110','11111'];
    cat.forEach((row,y)=>[...row].forEach((v,x)=>{if(v==='1')out+=`<rect x="${115+x*5}" y="${315+y*5}" width="5" height="5" fill="#c7d8aa"/>`}));

    const flame=s.s%2?4:0;out+=`<path d="M297 345 v-14 h5 v-${12+flame} h5 v8 h5 v18 Z" fill="#db7f50"/><rect x="302" y="334" width="5" height="11" fill="#eecb7c"/>`;
    return out+txt(C,402,`SECOND ${pad(s.s)}`,13,'#9dae8b',400,'letter-spacing="3"');

  function horizon(s,aod){
    if(aod)return ambientAod(s,'HORIZON');

    if(!day)out+=circle(sx+39,sy-19,84,'#171f30');
    out+=`<path d="M0 309 Q115 300 233 309 T466 309 V466 H0Z" fill="${day?'#9f6044':'#384453'}"/><path d="M0 332 Q110 314 233 331 T466 325 V466 H0Z" fill="${day?'#754b3d':'#2d3945'}"/><path d="M0 357 Q129 333 258 359 T466 342 V466 H0Z" fill="${day?'#503e35':'#24303a'}"/><path d="M0 389 Q120 357 270 389 T466 378 V466 H0Z" fill="${day?'#342f28':'#1b252e'}"/>`;
    out+=txt(C,77,'HORIZON',14,'#cdc6af',400,'letter-spacing="4"')+txt(C,218,hm(s),96,'#f4ecda',400,'letter-spacing="-3"');
    out+=line(152,251,314,251,'#f4ecda',.8,'opacity=".55"')+txt(C,277,day?'DAYLIGHT HOURS':'AFTER DARK',12,'#f4ecda',400,'letter-spacing="3"');
    return out+txt(C,407,date(s),15,'#d8c7aa',400,'letter-spacing="2"');
  }
  function tide(s,aod){
    if(aod)return ambientAod(s,'TIDE');
    let out=circle(C,C,233,'#101e28')+txt(C,80,'TIDE',15,'#b7c7c8',400,'letter-spacing="5"')+txt(C,216,hm(s),99,'#e8e9db',400,'letter-spacing="-3"')+txt(C,252,'20 OCTOBER / TUE',13,'#9cbbbd',400,'letter-spacing="2"');
    for(let k=0;k<7;k++){
      const y=289+k*19,offset=Math.sin(s.s*TAU/60+k*.7)*9;
      out+=`<path d="M-30 ${y} C50 ${y-24+offset},105 ${y+24+offset},185 ${y} S320 ${y-24-offset},390 ${y} S465 ${y+23},500 ${y}" fill="none" stroke="${k===0?'#92b9ba':'#48787d'}" stroke-width="${k===0?2:1.5}" opacity="${1-k*.09}"/>`;
    }
    const bx=86+s.s/59*294,by=289+Math.sin((s.s/59)*TAU)*8;
    out+=circle(bx,by,5,'#eea577')+line(bx,by-16,bx,by-5,'#eea577',1);
    return out+txt(C,410,`${pad(s.s)} / 60`,15,'#b7c7c8',400,'letter-spacing="3"');
  }
  function growth(s,aod){
    if(aod)return ambientAod(s,'GROWTH');
    let out=circle(C,C,233,'#242820');
    for(let n=0;n<12;n++){
      const r=30+n*15,points=[];for(let i=0;i<=120;i++){const a=i/120*TAU,rr=r+4*Math.sin(a*3+n*.9)+3*Math.cos(a*7+n*.7);points.push(pt(rr,a,231,235).map(v=>v.toFixed(2)).join(','))}
      out+=`<path d="M${points.join('L')}Z" fill="none" stroke="${n%3===0?'#9a9d72':'#737f5c'}" stroke-width="${n%3===0?1.4:1}" opacity="${n%3===0?.72:.65}"/>`;
    }
    out+=txt(C,76,'GROWTH / 2026',13,'#d1cfb1',400,'letter-spacing="3"');
    [0,3,6,9].forEach(hour=>{const p=pt(192,hour/12*TAU);out+=circle(...p,3,'#d3ceb0')});
    const hour=pt(94,((s.h%12)+s.m/60)*TAU/12),minute=pt(151,(s.m+s.s/60)*TAU/60),second=pt(172,s.s*TAU/60);
    out+=line(C,C,...hour,'#e9e5c9',7,'stroke-linecap="round"')+line(C,C,...minute,'#e9e5c9',3.5,'stroke-linecap="round"')+line(C,C,...second,'#da9c63',1.5)+circle(C,C,6,'#d9d8be')+circle(C,C,2,'#242820');
    out+=`<rect x="171" y="298" width="124" height="42" rx="21" fill="#242820"/>`+txt(C,329,hm(s),30,'#dedbc0',400,'letter-spacing="2"');
    return out+txt(C,407,'20 OCT / TUE',14,'#b6b99a',400,'letter-spacing="2"');
  }
  window.naturePlayFaces={maze,flip,pixel,horizon,tide,growth};
})();

</script>
<script>
(() => {
  'use strict';
  const groups=[{id:'instrument',name:'器械',en:'INSTRUMENT',note:'把精密机械，收进一枚圆屏。'},{id:'play',name:'玩物',en:'TIME TO PLAY',note:'每一秒，发生一点小事。'},{id:'ambient',name:'自然',en:'SLOW LANDSCAPES',note:'让时间有自己的地形。'}];
  const designs=[
    {id:'radar',group:'instrument',name:'雷达',en:'RADAR',description:'扫线指示秒，时分保持清晰。暗绿刻度与细线构成仪表层次。'},
    {id:'tape',group:'instrument',name:'磁带',en:'TAPE',description:'两只卷盘随秒转动，时间印在磁带标签上。保留模拟器材的触感。'},
    {id:'iris',group:'instrument',name:'光圈',en:'IRIS',description:'镜头叶片围绕中央时间，一条橙色秒标走过精细刻度。'},
    {id:'maze',group:'play',name:'迷宫秒',en:'MAZE',description:'红色小球逐秒走过外圈，迷宫纹理包围中央的堆叠时间。'},
    {id:'flip',group:'play',name:'翻页',en:'FOLD',description:'奶白纸牌与墨绿底色。横向折痕把大数字变成桌面翻页钟。'},
    {id:'pixel',group:'play',name:'夜营',en:'PIXEL CAMP',description:'点阵时间下，一只猫守着篝火。秒变化让火光和尾巴轻轻换帧。'},
    {id:'horizon',group:'ambient',name:'地平线',en:'HORIZON',description:'白昼与夜色随本地时段切换。日轮是时间意象，不冒充真实日出数据。'},
    {id:'tide',group:'ambient',name:'潮汐',en:'TIDE',description:'层层水线随秒起伏，橙色浮标点出当下。时间留在安静的上半屏。'},
    {id:'growth',group:'ambient',name:'年轮',en:'GROWTH',description:'有机轮廓代替规整刻度，细长时针穿过纹理，像树木记录时间。'}
  ];
  const collection=document.getElementById('collection'),state={h:10,m:8,s:36,date:new Date(2026,9,20)},dialog=document.getElementById('detail');
  let active=null,frame=0,lastStep=0,renderId=0;
  function svg(id,aod){
    const render=window.instrumentFaces[id]||window.naturePlayFaces[id];
    const clip=`round-${id}-${++renderId}`;
    return `<svg viewBox="0 0 466 466" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${designs.find(d=>d.id===id).name}，${String(state.h).padStart(2,'0')}:${String(state.m).padStart(2,'0')}" style="font-family:Barlow,sans-serif"><defs><clipPath id="${clip}"><circle cx="233" cy="233" r="232"/></clipPath></defs><g clip-path="url(#${clip})"><circle cx="233" cy="233" r="233" fill="#070908"/>${render(state,aod)}</g></svg>`;
  }
  groups.forEach(group=>{
    const section=document.createElement('section');section.className='series';section.dataset.group=group.id;
    section.innerHTML=`<div class="series-head"><h2>${group.name}</h2><span>${group.en}</span><p>${group.note}</p></div><div class="grid"></div>`;
    designs.filter(d=>d.group===group.id).forEach(design=>{
      const card=document.createElement('article');card.className='face-card';
      card.innerHTML=`<button class="face-button" data-face="${design.id}" aria-label="放大${design.name}表盘"></button><div class="face-meta"><div class="face-name"><h3>${design.name}</h3><span>${design.en}</span><div class="number">${String(designs.indexOf(design)+1).padStart(2,'0')}</div></div><p>${design.description}</p></div>`;
      section.querySelector('.grid').append(card);
    });collection.append(section);
  });
  function redraw(){const aod=document.getElementById('aod').checked;document.querySelectorAll('[data-face]').forEach(button=>{button.innerHTML=svg(button.dataset.face,aod)});if(active)document.getElementById('detail-face').innerHTML=svg(active,aod)}
  // 与固件现有逐秒节奏一致；隐藏页面时停止调度。 / Match the existing one-second cadence and stop scheduling while hidden.
  function tick(time){if(time-lastStep>=1000){state.s=(state.s+1)%60;if(state.s===0){state.m=(state.m+1)%60;if(state.m===0)state.h=(state.h+1)%24;document.getElementById('demo-time').value=`${String(state.h).padStart(2,'0')}:${String(state.m).padStart(2,'0')}`}redraw();lastStep=time}frame=requestAnimationFrame(tick)}
  function schedule(){cancelAnimationFrame(frame);frame=0;if(document.getElementById('motion').checked&&!document.getElementById('aod').checked&&!document.hidden){lastStep=performance.now();frame=requestAnimationFrame(tick)}}
  document.getElementById('demo-time').addEventListener('input',event=>{if(!event.target.value)return;[state.h,state.m]=event.target.value.split(':').map(Number);redraw()});
  document.getElementById('motion').addEventListener('change',schedule);
  document.getElementById('aod').addEventListener('change',()=>{redraw();schedule()});
  document.addEventListener('visibilitychange',schedule);window.addEventListener('pagehide',()=>cancelAnimationFrame(frame));
  document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));document.querySelectorAll('.series').forEach(section=>section.hidden=button.dataset.filter!=='all'&&button.dataset.filter!==section.dataset.group)}));
  collection.addEventListener('click',event=>{const button=event.target.closest('[data-face]');if(!button)return;active=button.dataset.face;document.getElementById('detail-name').textContent=designs.find(d=>d.id===active).name;redraw();dialog.showModal()});
  document.getElementById('close-detail').addEventListener('click',()=>dialog.close());dialog.addEventListener('close',()=>{active=null;document.getElementById('detail-face').replaceChildren()});
  // 仅供本地设计审阅与导出，不作为固件或真实遥测接口。 / Local design review/export only; this is neither firmware nor telemetry.
  window.watchfaceStudy={designs,state,redraw,render:svg,animationRunning:()=>Boolean(frame),setSeconds(value){state.s=((value%60)+60)%60;redraw()}};
  redraw();
})();
</script>
</html>
