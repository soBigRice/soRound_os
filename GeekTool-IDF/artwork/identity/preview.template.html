<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>soRound OS · 系统标志与开机动画</title>
<style>
:root{color-scheme:dark;--page:#151719;--ink:#f4f5f5;--muted:#969c9f;--line:#34393c;--red:#e54230}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{width:min(1510px,100%);margin:auto;padding:36px 28px 48px}header{display:flex;align-items:end;justify-content:space-between;gap:24px;padding-bottom:27px;border-bottom:1px solid var(--line)}h1{font-size:28px;line-height:1.3;font-weight:500;letter-spacing:-.5px;margin:0 0 8px}p{margin:0;color:var(--muted)}.review-note{font-size:12px;text-align:right}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:32px}figure{margin:0;min-width:0}.surface{aspect-ratio:1;position:relative;width:100%;display:grid;place-items:center}.surface svg{display:block;width:100%;height:auto}.chinese,.english{width:100%}.logo-surface{background:#f4f5f5;border-radius:50%}.logo-surface .light-logo,.logo-surface .dark-logo{width:42%}.logo-surface.dark{background:#000}.logo-surface .dark-logo{display:none}.logo-surface.dark .light-logo{display:none}.logo-surface.dark .dark-logo{display:block}.label{display:flex;justify-content:space-between;gap:14px;align-items:center;padding-top:20px}.label h2{font-size:18px;font-weight:500;margin:0}.label small{font-size:12px;color:var(--muted)}figcaption>p{font-size:13px;margin-top:7px;min-height:42px}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:16px}button,a.control{font:inherit;font-size:13px;line-height:1.4;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:8px 13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button:hover,a.control:hover{border-color:#858e93}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:4px}button[aria-pressed=true]{border-color:#f4f5f5;background:#f4f5f5;color:#17191b}.primary{background:var(--ink);color:#17191b;border-color:var(--ink)}.timeline{display:flex;align-items:center;gap:12px;margin-top:15px}.timeline input{width:100%;accent-color:var(--red);cursor:pointer}.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);white-space:nowrap;min-width:64px}.status{height:22px;font-size:12px;color:var(--muted);margin-top:8px}.english{display:none}.is-english .chinese{display:none}.is-english .english{display:block}.notes{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:30px;padding-top:23px;border-top:1px solid var(--line)}.notes h3{font-size:14px;margin:0 0 7px;font-weight:500}.notes p{font-size:13px;max-width:590px}.motion-beats{display:flex;gap:17px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}.motion-beats span{display:flex;gap:6px}.motion-beats b{color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}.native main{padding:0;width:466px}.native header,.native figcaption,.native .notes,.native .board>figure:not(.native-target){display:none}.native .board{display:block;margin:0}.native .surface{width:466px;height:466px}.native{background:transparent}.native .board>figure.native-target{display:block}.native.logo-native .logo-surface{border-radius:0}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.board>figure:last-child{grid-column:1/-1;width:min(466px,100%);justify-self:center}.review-note{max-width:230px}}@media(max-width:640px){main{padding:24px 18px 32px}header{display:block}.review-note{text-align:left;margin-top:12px}.board{grid-template-columns:1fr;gap:34px}.board>figure{max-width:466px;width:100%;justify-self:center}.notes{grid-template-columns:1fr;gap:20px}.label{padding-top:13px}figcaption>p{min-height:0}h1{font-size:26px}}
</style>
</head>
<body>
<main>
<header><div><h1>soRound OS</h1><p>系统标志 · 关于本机 · 开机动画</p></div><p class="review-note">SVG 设计参考 · 466 × 466 圆屏<br>原生实现已完成 · 真机效果待验收</p></header>
<section class="board" aria-label="系统品牌设计预览">
<figure id="logo-figure"><div class="surface logo-surface" id="logo-surface"><div class="light-logo">{{LOGO}}</div><div class="dark-logo">{{LOGO_DARK}}</div></div><figcaption><div class="label"><h2>系统标志</h2><small>透明矢量 · 原图比例</small></div><p>保留完整圆环、右上红点和两者之间的间隙。</p><div class="tools"><button type="button" id="theme-toggle" aria-pressed="false">黑底预览</button><a class="control" href="logo.svg" download>下载 SVG</a><a class="control" href="logo-dark.svg" download>白环 SVG</a></div></figcaption></figure>
<figure id="about-figure"><div class="surface" id="about-surface"><div class="chinese">{{ABOUT}}</div><div class="english">{{ABOUT_EN}}</div></div><figcaption><div class="label"><h2>关于本机</h2><small>466 × 466</small></div><p>标志作为视觉中心；沿用返回按钮、电量环与设备信息。</p><div class="tools"><button type="button" id="language-toggle" aria-pressed="false">English</button><a class="control" href="about.svg" download>下载设计稿</a><a class="control" href="native/about-zh.png">原生渲染</a></div></figcaption></figure>
<figure id="boot-figure"><div class="surface" id="boot-surface">{{BOOT}}</div><figcaption><div class="label"><h2>开机动画</h2><small>至少4秒 · 单次 · 静音</small></div><p>圆环逐步成形，红点沿短弧归位，系统名轻轻浮现。</p><div class="tools"><button type="button" id="play" class="primary">播放</button><button type="button" id="replay">重播</button><a class="control" href="boot.svg" download>动画 SVG</a><a class="control" href="native/startup-20261007/boot.mp4">原生动画</a></div><label class="timeline"><input id="scrub" type="range" min="0" max="4000" step="10" value="0" aria-label="开机动画时间轴"><output class="time" id="time">0.00 / 4.00</output></label><p class="status" id="status" aria-live="polite">就绪</p></figcaption></figure>
</section>
<section class="notes" aria-label="设计说明"><div><h3>同一几何，适配黑白表面</h3><p>浅色表面用墨黑圆环；AMOLED 黑底用白环。红色保持原图的 #E54230。矢量没有背景、阴影或模糊，放大不会损失轮廓。</p></div><div><h3>开机动效节奏</h3><p>动画至少4秒，设备初始化与核心自检通过后进入表盘。离线状态明确提示；浏览器仅展示最短动画时间轴。原生渲染图/视频来自 LVGL 主机运行，版本与电量是测试夹具；设备观感待验收。</p><div class="motion-beats"><span><b>0.14s</b> 红点出现</span><span><b>0.27s</b> 圆环展开</span><span><b>1.82s</b> 名称浮现</span><span><b>4.00s+</b> 自检后放行</span></div></div></section>
</main>
<script>
(() => {
  const svg = document.querySelector('#boot-surface > svg');
  const play = document.querySelector('#play');
  const scrub = document.querySelector('#scrub');
  const time = document.querySelector('#time');
  const status = document.querySelector('#status');
  const duration = 4;
  let running = false;
  let frame = 0;
  svg.pauseAnimations();
  svg.setCurrentTime(0);
  function showTime(position) {
    scrub.value = Math.round(position * 1000);
    time.value = position.toFixed(2) + ' / 4.00';
  }
  function update() {
    const position = Math.min(duration, svg.getCurrentTime());
    showTime(position);
    if (running && position >= duration) {
      svg.pauseAnimations(); svg.setCurrentTime(duration); running = false;
      play.textContent = '播放'; status.textContent = '动画完成 · 标志定格';
    }
    if (running) frame = requestAnimationFrame(update);
  }
  function pause() {
    svg.pauseAnimations(); running = false; cancelAnimationFrame(frame);
    play.textContent = '播放'; status.textContent = '已暂停'; update();
  }
  function start() {
    if (svg.getCurrentTime() >= duration) svg.setCurrentTime(0);
    cancelAnimationFrame(frame); running = true; svg.unpauseAnimations();
    play.textContent = '暂停'; status.textContent = '播放中'; update();
  }
  function seek(seconds) {
    const position = Math.max(0, Math.min(duration, seconds));
    pause(); svg.setCurrentTime(position); showTime(position);
  }
  play.addEventListener('click', () => running ? pause() : start());
  document.querySelector('#replay').addEventListener('click', () => {seek(0); start();});
  scrub.addEventListener('input', () => seek(Number(scrub.value) / 1000));
  document.querySelector('#theme-toggle').addEventListener('click', event => {
    const dark = document.querySelector('#logo-surface').classList.toggle('dark');
    event.currentTarget.setAttribute('aria-pressed', String(dark));
    event.currentTarget.textContent = dark ? '浅底预览' : '黑底预览';
  });
  document.querySelector('#language-toggle').addEventListener('click', event => {
    const english = document.querySelector('#about-surface').classList.toggle('is-english');
    event.currentTarget.setAttribute('aria-pressed', String(english));
    event.currentTarget.textContent = english ? '中文' : 'English';
  });
  const params = new URLSearchParams(location.search);
  const surface = params.get('surface');
  if (['about', 'boot', 'logo'].includes(surface)) {
    document.body.classList.add('native');
    document.querySelector('#' + surface + '-figure').classList.add('native-target');
    if (surface === 'logo') document.body.classList.add('logo-native');
  }
  if (params.get('lang') === 'en') document.querySelector('#language-toggle').click();
  const requestedTime = Number(params.get('t'));
  if (params.has('t') && Number.isFinite(requestedTime)) seek(requestedTime);
  else {seek(duration); status.textContent = '点击播放查看动画';}
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    seek(duration); status.textContent = '已按系统偏好显示静态标志；可手动播放';
  }
  document.addEventListener('visibilitychange', () => {if (document.hidden && running) pause();});
  window.addEventListener('pagehide', pause);
  // Deterministic review/export hook; it only controls this local SVG timeline.
  window.identityPreview = {seek, start, pause, svg, get running() {return running;}};
})();
</script>
</body>
</html>
