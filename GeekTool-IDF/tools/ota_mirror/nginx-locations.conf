# Include inside the dedicated ota.miaozong.cc HTTPS server block.
# /srv/geektool-ota/public must be mounted into the OpenResty container at this path.
# A publicly trusted certificate is required; a Cloudflare Origin CA certificate
# cannot be used after disabling the Cloudflare proxy.
root /srv/geektool-ota/public;
gzip off;
etag on;
open_file_cache off;
sendfile on;
send_timeout 60s;
max_ranges 1;

location = /GeekTool.bin {
    default_type application/octet-stream;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET HEAD { deny all; }
}

location = /GeekTool-beta.bin {
    default_type application/octet-stream;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET HEAD { deny all; }
}

location / { return 404; }
